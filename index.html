<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>சேவை நிலை அறிய - தாஸ் பொது சேவை மையம்</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;600;700&display=swap');
  :root { --bg:#f4f6f9; --card:#fff; --ink:#0f172a; --mute:#64748b; --brand:#1e3a8a; --line:#e2e8f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --ink:#f1f5f9; --mute:#94a3b8; --brand:#60a5fa; --line:#334155; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font-family:'Mukta Malar','Latha',sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:560px; margin:0 auto; }
  header { text-align:center; padding:18px 8px 8px; }
  header h1 { margin:0; font-size:20px; color:var(--brand); }
  header p { margin:4px 0 0; color:var(--mute); font-size:14px; }
  .card { background:var(--card); border-radius:12px; padding:18px; box-shadow:0 4px 12px rgba(0,0,0,.08); margin-top:14px; }
  label { font-weight:600; font-size:14px; }
  input { width:100%; padding:13px; margin-top:6px; font-size:17px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-family:inherit; letter-spacing:.5px; }
  button.main { width:100%; margin-top:12px; padding:13px; font-size:17px; font-weight:700; border:0; border-radius:8px; background:var(--brand); color:#fff; cursor:pointer; font-family:inherit; }
  @media (prefers-color-scheme: dark) { button.main { color:#0f172a; } }
  button.main:disabled { opacity:.6; }
  .res { border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }
  .svc { font-weight:700; font-size:16px; }
  .badge { display:inline-block; margin-top:8px; padding:6px 12px; border-radius:20px; font-weight:700; font-size:15px; }
  .s-pending { background:#fef3c7; color:#92400e; }
  .s-progress { background:#dbeafe; color:#1e40af; }
  .s-done { background:#dcfce7; color:#166534; }
  .s-rejected { background:#fee2e2; color:#991b1b; }
  .steps { display:flex; align-items:center; margin:14px 0 4px; }
  .dot { width:22px; height:22px; border-radius:50%; background:var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .bar { flex:1; height:4px; background:var(--line); }
  .on { background:#16a34a; } .on.rej { background:#dc2626; }
  .lbls { display:flex; justify-content:space-between; font-size:12px; color:var(--mute); }
  .note { margin-top:10px; padding:10px; background:var(--bg); border-radius:8px; font-size:15px; }
  .meta { margin-top:8px; font-size:13px; color:var(--mute); }
  .msg { text-align:center; padding:14px 6px 4px; color:var(--mute); }
  .contact { display:flex; gap:8px; margin-top:14px; }
  .contact a { flex:1; text-align:center; padding:11px; border-radius:8px; text-decoration:none; font-weight:700; font-size:15px; border:1px solid var(--brand); color:var(--brand); }
  footer { text-align:center; color:var(--mute); font-size:12px; margin:18px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>தாஸ் பொது சேவை மையம்</h1>
    <p>தூத்துக்குடி · உங்கள் சேவை நிலை அறிய</p>
  </header>

  <div class="card">
    <label for="ref">விண்ணப்ப / குறிப்பு எண்</label>
    <input id="ref" type="text" placeholder="எ.கா: TN-5202608011162" autocomplete="off" autocapitalize="characters">
    <button class="main" id="go" onclick="check()">நிலை பார்க்க</button>
    <div id="out"></div>
  </div>

  <div class="contact">
    <a href="tel:9843232324">📞 அழைக்க</a>
    <a href="https://wa.me/919843232324" target="_blank" rel="noopener">💬 WhatsApp</a>
  </div>
  <footer>உங்கள் ஒப்புகைச்சீட்டில் உள்ள எண்ணை உள்ளிடவும்</footer>
</div>

<script>
// StatusCode.gs Deploy செய்த Web App URL-ஐ இங்கே ஒட்டவும்
const STATUS_URL = 'https://script.google.com/macros/s/AKfycbxWxJYfGmT1b2CRoGQFCJYRel3RTsi0mrwqs3M3dUjOORQJMruxV9VdadIxuJVNNnxibg/exec';

const LABEL = { pending:'⏳ நிலுவையில்', progress:'🔧 செயல்பாட்டில்', done:'✅ முடிந்தது', rejected:'❌ நிராகரிக்கப்பட்டது' };

function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function fmt(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString('ta-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function steps(st) {
  const idx = { pending:0, progress:1, done:2, rejected:2 }[st] || 0;
  const rej = st === 'rejected';
  let h = '<div class="steps">';
  for (let i = 0; i < 3; i++) {
    h += '<div class="dot' + (i <= idx ? ' on' + (rej && i === 2 ? ' rej' : '') : '') + '">' + (i <= idx ? (rej && i === 2 ? '✕' : '✓') : '') + '</div>';
    if (i < 2) h += '<div class="bar' + (i < idx ? ' on' : '') + '"></div>';
  }
  return h + '</div><div class="lbls"><span>பெறப்பட்டது</span><span>செயல்பாட்டில்</span><span>' + (rej ? 'நிராகரிப்பு' : 'முடிந்தது') + '</span></div>';
}

async function check() {
  const ref = document.getElementById('ref').value.trim();
  const out = document.getElementById('out');
  const btn = document.getElementById('go');
  if (ref.replace(/[\s\-]/g, '').length < 5) { out.innerHTML = '<div class="msg">சரியான குறிப்பு எண்ணை உள்ளிடவும்</div>'; return; }
  if (!STATUS_URL || STATUS_URL.indexOf('PASTE_') === 0) { out.innerHTML = '<div class="msg">அமைப்பு முடிவடையவில்லை</div>'; return; }
  btn.disabled = true; out.innerHTML = '<div class="msg">தேடுகிறது...</div>';
  try {
    const res = await fetch(STATUS_URL + '?action=status&ref=' + encodeURIComponent(ref));
    const d = await res.json();
    if (!d.ok) throw new Error(d.error);
    if (!d.items.length) {
      out.innerHTML = '<div class="msg">இந்த எண்ணுக்கு பதிவு இல்லை.<br>எண்ணை சரிபார்க்கவும் அல்லது மையத்தை தொடர்பு கொள்ளவும்.</div>';
    } else {
      out.innerHTML = d.items.map(function (r) {
        return '<div class="res">' +
          '<div class="svc">' + esc(r.serviceType) + (r.serviceName ? ' - ' + esc(r.serviceName) : '') + '</div>' +
          '<span class="badge s-' + esc(r.status) + '">' + (LABEL[r.status] || esc(r.status)) + '</span>' +
          steps(r.status) +
          (r.note ? '<div class="note">📝 ' + esc(r.note) + '</div>' : '') +
          '<div class="meta">பதிவு: ' + fmt(r.createdAt) + (r.updatedAt && r.updatedAt !== r.createdAt ? ' · புதுப்பிப்பு: ' + fmt(r.updatedAt) : '') + '</div>' +
          '</div>';
      }).join('');
    }
  } catch (e) {
    out.innerHTML = '<div class="msg">⚠️ இணைக்க முடியவில்லை. பிறகு முயற்சிக்கவும்.</div>';
  }
  btn.disabled = false;
}
document.getElementById('ref').addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
</script>
</body>
</html>
